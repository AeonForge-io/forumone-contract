[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The signed-order paths push the implementation over EIP-170 with the legacy pipeline; the IR
# pipeline is what brings it back under, together with the external SignedOrderChecks library.
# solc 0.8.28 supports via-IR fully. It costs roughly a minute of compile time on a clean build.
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
# The contract-testbed surface analysis reads the solc AST out of out/*.json, and forge only emits it on request.
ast = true

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
ethereum_mainnet = "${ETHEREUM_RPC_URL}"
ethereum_sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
polygon_mainnet = "${POLYGON_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"
localhost = "http://127.0.0.1:8545"

# Etherscan V2: one etherscan.io key verifies on Etherscan, Basescan and Polygonscan alike, and
# forge selects the chain by id at https://api.etherscan.io/v2/api?chainid=<id>. No `url` here on
# purpose - a pinned url is taken verbatim, and the per-explorer v1 hosts were retired in 2025
# (they now answer "You are using a deprecated V1 endpoint").
[etherscan]
ethereum_mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
ethereum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base_mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
polygon_mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 137 }
polygon_amoy = { key = "${ETHERSCAN_API_KEY}", chain = 80002 }
